name: sbg-coffee-dev
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: sbg
      POSTGRES_PASSWORD: sbg_local_only
      POSTGRES_DB: sbg
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbg -d sbg"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres_dev:
