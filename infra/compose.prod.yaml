name: sbg-coffee-production
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
x-api: &api
  image: ${API_IMAGE:?Set a ghcr.io package image pinned to sha256 digest}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the server env file}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
  networks:
    - backend
  logging: *logging
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  migrate:
    <<: *api
    profiles: ["tools"]
    command: ["npm", "run", "db:migrate", "--workspace", "@sbg/api"]
    restart: "no"
  api:
    <<: *api
    ports:
      - "127.0.0.1:3100:3000"
    # Host nginx reaches the published port through the non-internal network.
    networks:
      - backend
      - edge
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
networks:
  backend:
    internal: true
  edge:
volumes:
  postgres_data:
    name: sbg-coffee-production-postgres
