# Install first in /etc/nginx/bx/site_ext_enabled/; keep it for certificate renewal.
# This file does not require a certificate or a running API.
server {
    listen 80;
    server_name sbg-api.hyundaielevator.kz;

    # Existing Bitrix/dehydrated challenge location; do not move the redirect
    # to server scope because that would also redirect ACME challenge requests.
    include /etc/nginx/bx/conf/letsencrypt-challenge-tokens.conf;

    location / {
        return 301 https://sbg-api.hyundaielevator.kz$request_uri;
    }
}
