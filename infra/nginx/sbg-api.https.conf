# Install in /etc/nginx/bx/site_ext_enabled/ only after this certificate exists.
# Keep sbg-api.http.conf enabled alongside this file.
server {
    listen 443 ssl http2;
    server_name sbg-api.hyundaielevator.kz;

    ssl_certificate /home/bitrix/dehydrated/certs/sbg-api.hyundaielevator.kz/fullchain.pem;
    ssl_certificate_key /home/bitrix/dehydrated/certs/sbg-api.hyundaielevator.kz/privkey.pem;
    ssl_trusted_certificate /home/bitrix/dehydrated/certs/sbg-api.hyundaielevator.kz/chain.pem;
    include /etc/nginx/bx/conf/ssl_options.conf;

    location / {
        # No URI suffix: preserve /api/v1 paths and query strings.
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
